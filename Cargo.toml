[package]
name = "kass"
version = "0.1.0"
edition = "2024"
description = "Lint rules in plain English, judged one test at a time by TypeSafe's Jev"
license = "MIT"
repository = "https://github.com/victorarias/kass"
readme = "README.md"
keywords = ["lint", "testing", "ai", "code-review", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
